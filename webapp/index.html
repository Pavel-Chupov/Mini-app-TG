<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Калькулятор</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="calculator">

    <!-- Экран калькулятора -->
    <div class="display">
        <div class="expression">123 + 45 × 6</div>
        <div class="result">393</div>
        <div class="accent-line"></div>
    </div>

    <!-- Кнопки -->
    <div class="buttons">

        <button class="button function">C</button>
        <button class="button function">+/-</button>
        <button class="button function">%</button>
        <button class="button operator">÷</button>

        <button class="button number">7</button>
        <button class="button number">8</button>
        <button class="button number">9</button>
        <button class="button operator">×</button>

        <button class="button number">4</button>
        <button class="button number">5</button>
        <button class="button number">6</button>
        <button class="button operator">−</button>

        <button class="button number">1</button>
        <button class="button number">2</button>
        <button class="button number">3</button>
        <button class="button operator">+</button>

        <button class="button number zero">0</button>
        <button class="button number">,</button>
        <button class="button equals">=</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
